[package]
name = "certael-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
certael-agent-ipc = { path = "../certael-agent-ipc" }
certael-agent-platform = { path = "../certael-agent-platform" }
certael-agent-protocol = { path = "../certael-agent-protocol" }
certael-agent-updater = { path = "../certael-agent-updater" }
clap = { version = "4", features = ["derive"] }
ed25519-dalek.workspace = true
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
hex.workspace = true
prost.workspace = true
rand_core.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
uuid.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
certael-agent-probe = { path = "../certael-agent-probe" }
