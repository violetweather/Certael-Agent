name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: certael-agent-linux-x86_64
          - os: windows-2025
            artifact: certael-agent-windows-x86_64
          - os: macos-15
            artifact: certael-agent-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/certael-agent dist/
          cp target/release/libcertael_agent_probe.* dist/ 2>/dev/null || true
          cp README.md LICENSE include/certael_agent_probe.h dist/
          tar -C dist -czf "${{ matrix.artifact }}.tar.gz" .
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item target/release/certael-agent.exe dist/
          Copy-Item target/release/certael_agent_probe.dll dist/
          Copy-Item README.md,LICENSE,include/certael_agent_probe.h dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.artifact }}.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: certael-agent-*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: certael-agent-*
          path: release
          merge-multiple: true
      - name: Generate CycloneDX SBOMs
        run: |
          set -euo pipefail
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --format json --spec-version 1.5 --target all
          find . -path '*/target' -prune -o -name bom.json -print0 | \
            tar --null -czf "release/certael-agent-sbom-${GITHUB_REF_NAME}.tar.gz" --files-from=-
      - name: Checksums
        run: (cd release && sha256sum * > checksums-sha256.txt)
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: { cosign-release: v3.0.6 }
      - name: Keyless-sign release files
        run: |
          set -euo pipefail
          for artifact in release/*; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
          done
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with: { subject-path: "release/**" }
      - name: Publish pre-release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --generate-notes
