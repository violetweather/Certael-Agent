name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: certael-agent-linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            artifact: certael-agent-windows-x86_64
            target: x86_64-pc-windows-msvc
          - os: macos-15
            artifact: certael-agent-macos-arm64
            target: aarch64-apple-darwin
          - os: macos-15
            artifact: certael-agent-macos-x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: Require and apply Windows production signatures
        if: runner.os == 'Windows' && startsWith(github.ref_name, 'v1.')
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_AUTHENTICODE_PFX_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_AUTHENTICODE_PFX_PASSWORD }}
        run: |
          ./scripts/sign-windows.ps1 `
            -CertificateBase64 $env:CERTIFICATE_BASE64 `
            -CertificatePassword $env:CERTIFICATE_PASSWORD `
            -Files @(
              "target/${{ matrix.target }}/release/certael-agent.exe",
              "target/${{ matrix.target }}/release/certael-agent-launcher.exe",
              "target/${{ matrix.target }}/release/certael_agent_probe.dll"
            )
      - name: Require and apply macOS production signatures
        if: runner.os == 'macOS' && startsWith(github.ref_name, 'v1.')
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
        run: |
          ./scripts/sign-macos.sh \
            "target/${{ matrix.target }}/release/certael-agent" \
            "target/${{ matrix.target }}/release/certael-agent-launcher" \
            "target/${{ matrix.target }}/release/libcertael_agent_probe.dylib"
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/certael-agent" dist/
          cp "target/${{ matrix.target }}/release/certael-agent-launcher" dist/
          cp target/${{ matrix.target }}/release/libcertael_agent_probe.* dist/ 2>/dev/null || true
          cp README.md LICENSE include/certael_agent_probe.h release/compatibility-v1.json dist/
          cp -R install dist/
          cp -R examples dist/
          mkdir -p dist/docs
          cp docs/INSTALLING.md docs/UPDATES.md docs/TUF-CEREMONY.md dist/docs/
          tar -C dist -czf "${{ matrix.artifact }}.tar.gz" .
      - name: Notarize stable macOS archive
        if: runner.os == 'macOS' && startsWith(github.ref_name, 'v1.')
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          : "${APPLE_ID:?Stable macOS releases require an Apple ID}"
          : "${APPLE_TEAM_ID:?Stable macOS releases require an Apple team ID}"
          : "${APPLE_APP_PASSWORD:?Stable macOS releases require an app password}"
          ditto -c -k --keepParent dist "${{ matrix.artifact }}.zip"
          xcrun notarytool submit "${{ matrix.artifact }}.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
      - name: Smoke packaged Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          test_dir="$(mktemp -d)"
          tar -xzf "${{ matrix.artifact }}.tar.gz" -C "$test_dir"
          test -s "$test_dir/compatibility-v1.json"
          test -s "$test_dir/certael_agent_probe.h"
          "$test_dir/certael-agent" --help
          test -x "$test_dir/certael-agent-launcher"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item "target/${{ matrix.target }}/release/certael-agent.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/certael-agent-launcher.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/certael_agent_probe.dll" dist/
          Copy-Item README.md,LICENSE,include/certael_agent_probe.h,release/compatibility-v1.json dist/
          Copy-Item install -Destination dist/install -Recurse
          Copy-Item examples -Destination dist/examples -Recurse
          New-Item -ItemType Directory -Force dist/docs
          Copy-Item docs/INSTALLING.md,docs/UPDATES.md,docs/TUF-CEREMONY.md dist/docs/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.artifact }}.zip"
      - name: Smoke packaged Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive "${{ matrix.artifact }}.zip" -DestinationPath smoke
          if (-not (Test-Path smoke/compatibility-v1.json -PathType Leaf)) { throw "compatibility manifest is missing" }
          if (-not (Test-Path smoke/certael_agent_probe.h -PathType Leaf)) { throw "probe header is missing" }
          & smoke/certael-agent.exe --help
          if (-not (Test-Path smoke/certael-agent-launcher.exe -PathType Leaf)) { throw "launcher is missing" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: certael-agent-*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with: { toolchain: 1.97.0 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: certael-agent-*
          path: release
          merge-multiple: true
      - name: Generate CycloneDX SBOMs
        run: |
          set -euo pipefail
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          bash scripts/package-sbom.sh "release/certael-agent-sbom-${GITHUB_REF_NAME}.tar.gz"
      - name: Checksums
        run: (cd release && sha256sum * > checksums-sha256.txt)
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: { cosign-release: v3.0.6 }
      - name: Keyless-sign release files
        run: |
          set -euo pipefail
          for artifact in release/*; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
          done
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with: { subject-path: "release/**" }
      - name: Publish release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -euo pipefail
          flags=(--repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes)
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release/* "${flags[@]}"
